<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            margin: 0;
            background: transparent;
        }

        .audio-overlay {
            position: fixed;
            /* right: 20px; */
            top: 50%;
            /* transform: translateY(-50%); */

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;

            /* padding: 14px 10px; */
            background: rgba(137, 115, 140, 0);
            border-radius: 30px;
        }

        button {
            border: none;
            background: transparent;
            color: rgb(255, 255, 255);
            font-size: 20px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;

            /* Make the slider vertical */
            transform: rotate(-90deg);
        }
    </style>

</head>

<body>

    <audio id="audio" src="audio/track_01.mp3"></audio>

    <div class="audio-overlay">

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >
        <button id="playPause">▶</button>

    </div>

    <script>
        const audio = document.getElementById("audio");
        const playPause = document.getElementById("playPause");
        const volume = document.getElementById("volume");

        playPause.onclick = () => {
            if (audio.paused) {
                audio.play();
                playPause.textContent = "❚❚";
            } else {
                audio.pause();
                playPause.textContent = "▶";
            }
        };

        volume.oninput = () => {
            audio.volume = volume.value;
        };
    </script>

</body>
</html>
